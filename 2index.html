.choices .active.okb{background:var(--ok);color:white;border-color:var(--ok)}.choices .active.badb{background:var(--bad);color:white;border-color:var(--bad)}

.thumb{position:relative}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;display:block}

<option value="TWKSG">TWKSG</option>

</div></div></details>
<div class="progress"><b>填寫進度 <span id="progText">0 / 0</span></b><div class="barbg"><div class="bar" id="bar"></div></div></div>
<div id="checks"></div>


</main></div>
<div id="saveToast" style="display:none;position:fixed;left:50%;bottom:145px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 15px;border-radius:20px;font-size:13px;z-index:99;box-shadow:0 2px 8px #0004">草稿已儲存</div>

</div>

let inspectionData=formData.deck, answers={}, photoStore={};
const formType=document.getElementById('formType');
const vessel=document.getElementById('vessel');
const port=document.getElementById('port');
const date=document.getElementById('date');
const inspector=document.getElementById('inspector');
const voyage=document.getElementById('voyage');
const checks=document.getElementById('checks');
const progText=document.getElementById('progText');
const bar=document.getElementById('bar');

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initVessels(){vessels.forEach(v=>{let o=document.createElement('option');o.value=v[1];o.textContent=`${v[0]} (${v[1]})`;vessel.appendChild(o)})}

function render(){
 inspectionData=formData[formType.value]||formData.deck; answers={}; photoStore={};
 checks.innerHTML=''; let total=0;
 Object.entries(inspectionData).forEach(([area,items],si)=>{
   let d=document.createElement('details');d.className='section';
   d.innerHTML=`<summary>${area} <span>▼</span></summary><div class="inside"></div>`;checks.appendChild(d);
   let box=d.querySelector('.inside');
   items.forEach((q,i)=>{
     total++; let key=area+'|'+q, x=document.createElement('div');x.className='item';x.dataset.key=key;
     x.innerHTML=`<div class="head"><div class="q">${i+1}. ${q}</div><div class="choices"><button type="button" class="okb" onclick="setAns(this,'✓')">✓</button><button type="button" class="badb" onclick="setAns(this,'✕')">✕</button></div></div><input class="remark" placeholder="備註 Remark..."><label class="photo">📷 上傳照片<input type="file" accept="image/*" multiple onchange="preview(this)"></label><div class="thumbs"></div>`;
     box.appendChild(x);
   });
 });
 window.totalItems=total;progress();
}
function setAns(btn,val){let row=btn.closest('.item'),key=row.dataset.key;if(answers[key]===val){delete answers[key];row.classList.remove('ok','bad');row.querySelectorAll('.choices button').forEach(b=>b.classList.remove('active'))}else{answers[key]=val;row.classList.remove('ok','bad');row.classList.add(val==='✓'?'ok':'bad');row.querySelectorAll('.choices button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}progress();scheduleSave()}
function progress(){let n=Object.keys(answers).length;progText.textContent=`${n} / ${window.totalItems||0}`;bar.style.width=((n/(window.totalItems||1))*100)+'%'}

function preview(inp){
 const row=inp.closest('.item'), key=row.dataset.key;
 if(!photoStore[key]) photoStore[key]=[];
 [...inp.files].forEach(file=>{
   const r=new FileReader();
   r.onload=e=>{photoStore[key].push(e.target.result); drawPhotos(row,key);scheduleSave()};
   r.readAsDataURL(file);
 });
 inp.value='';
}
function drawPhotos(row,key){
 const box=row.querySelector('.thumbs');box.innerHTML='';
 (photoStore[key]||[]).forEach((src,i)=>{
   const w=document.createElement('div');w.className='thumb';
   w.innerHTML=`<img src="${src}"><button type="button" class="delphoto" title="刪除照片">×</button>`;
   w.querySelector('button').onclick=()=>{photoStore[key].splice(i,1);drawPhotos(row,key);scheduleSave()};
   box.appendChild(w);
 });
}

 location.href=`mailto:?subject=${sub}&body=${body}`;
}

 <div class="info"><div><b>船名：</b>${esc(vessel.options[vessel.selectedIndex].text)}</div><div><b>表單：</b>${esc(formType.options[formType.selectedIndex].text)}</div><div><b>港口：</b>${esc(port.value)}</div><div><b>日期：</b>${esc(date.value)}</div><div><b>訪船人員：</b>${esc(inspector.value)}</div><div><b>單位：</b>SPD</div><div><b>航次：</b>${esc(voyage.value)}</div><div></div></div>

const DRAFT_KEY='spdVesselInspectionDraft_v1';
const DB_NAME='spdVesselInspectionPhotos';
const DB_STORE='photos';
let restoringDraft=false, saveTimer=null;

function openPhotoDB(){
 return new Promise((resolve,reject)=>{
   const req=indexedDB.open(DB_NAME,1);
   req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};
   req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
 });
}
async function savePhotosDB(){
 try{
   const db=await openPhotoDB(), tx=db.transaction(DB_STORE,'readwrite'), st=tx.objectStore(DB_STORE);
   st.put(photoStore,'current');
 }catch(e){console.warn('Photo autosave failed',e)}
}
async function loadPhotosDB(){
 try{
   const db=await openPhotoDB();
   return await new Promise((resolve,reject)=>{
     const req=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get('current');
     req.onsuccess=()=>resolve(req.result||{}); req.onerror=()=>reject(req.error);
   });
 }catch(e){return {}}
}
async function clearPhotosDB(){
 try{const db=await openPhotoDB();db.transaction(DB_STORE,'readwrite').objectStore(DB_STORE).delete('current')}catch(e){}
}
function collectRemarks(){
 const r={}; document.querySelectorAll('.item').forEach(row=>r[row.dataset.key]=row.querySelector('.remark').value); return r;
}
function saveDraft(show=false){
 if(restoringDraft)return;
 const draft={
   formType:formType.value,vessel:vessel.value,port:port.value,date:date.value,
   inspector:inspector.value,voyage:voyage.value,
   answers:{...answers},remarks:collectRemarks(),savedAt:new Date().toISOString()
 };
 localStorage.setItem(DRAFT_KEY,JSON.stringify(draft)); savePhotosDB();
 if(show)showSaved();
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveDraft(false),250)}
function showSaved(){
 const el=document.getElementById('saveToast'); if(!el)return;
 const t=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
 el.textContent='✅ 草稿已儲存 '+t;el.style.display='block';setTimeout(()=>el.style.display='none',1800);
}
async function restoreDraft(){
 let raw=localStorage.getItem(DRAFT_KEY); if(!raw)return;
 try{
   const d=JSON.parse(raw); restoringDraft=true;
   if(d.formType){formType.value=d.formType;render()}
   vessel.value=d.vessel||'';port.value=d.port||'';date.value=d.date||date.value;
   inspector.value=d.inspector||'';voyage.value=d.voyage||'';
   answers=d.answers||{}; photoStore=await loadPhotosDB();
   document.querySelectorAll('.item').forEach(row=>{
     const key=row.dataset.key, val=answers[key];
     row.querySelector('.remark').value=(d.remarks||{})[key]||'';
     row.classList.remove('ok','bad');
     row.querySelectorAll('.choices button').forEach(b=>b.classList.remove('active'));
     if(val==='✓'){row.classList.add('ok');row.querySelector('.okb').classList.add('active')}
     if(val==='✕'){row.classList.add('bad');row.querySelector('.badb').classList.add('active')}
     drawPhotos(row,key);
   });
   progress(); restoringDraft=false;
   if(d.savedAt)document.getElementById('saveToast').textContent='已恢復上次草稿';
 }catch(e){restoringDraft=false;console.warn(e)}
}

async function newInspection(){
 const ok=confirm('確定要開始新的訪船檢查嗎？\n\n目前暫存的填寫內容及照片將會清除。\n若尚未完成 Report，請先按「取消」。');
 if(!ok)return;
 localStorage.removeItem(DRAFT_KEY);
 await clearPhotosDB();
 restoringDraft=true;
 answers={};photoStore={};
 formType.value='deck';render();
 vessel.value='';port.value='';inspector.value='';voyage.value='';
 const now=new Date();
 date.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
 restoringDraft=false;
 saveDraft(false);
 const el=document.getElementById('saveToast');
 el.textContent='✅ 已開始新的訪船檢查';
 el.style.display='block';
 setTimeout(()=>el.style.display='none',1800);
 window.scrollTo({top:0,behavior:'smooth'});
}

async function clearDraft(){
 if(!confirm('確定要清除目前草稿並開始新的表單嗎？'))return;
 localStorage.removeItem(DRAFT_KEY);await clearPhotosDB();
 answers={};photoStore={};formType.value='deck';render();
 vessel.value='';port.value='';inspector.value='';voyage.value='';
 const now=new Date();date.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
 alert('草稿已清除，可以開始新的訪船檢查。');
}
document.addEventListener('input',e=>{if(e.target.matches('input,textarea,select'))scheduleSave()});
document.addEventListener('change',e=>{if(e.target.matches('input,textarea,select'))scheduleSave()});

document.addEventListener('DOMContentLoaded',async()=>{
 initVessels();
 const now=new Date();
 date.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
 render();
 await restoreDraft();
});
